<!DOCTYPE html>
<html>

<head>

<title>Military Hacker 69 - Create Account</title>

<style>

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    font-family:Arial;
    overflow:hidden;
    background:#000;
}


/* animasi kod hacker */

.code{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    color:#00ff00;
    font-family:monospace;
    font-size:18px;
    line-height:35px;
    opacity:0.25;
    z-index:-1;
    animation:move 10s linear infinite;
}


@keyframes move{

from{
transform:translateY(0);
}

to{
transform:translateY(-300px);
}

}


/* kotak register */

.box{

width:350px;
padding:35px;
background:rgba(0,0,0,0.8);
border:1px solid #00ff00;
border-radius:15px;
text-align:center;
color:white;

}


h1{

color:#00ff00;

}


input{

width:90%;
padding:12px;
margin:10px;
border-radius:8px;
border:none;
font-size:16px;

}


button{

width:95%;
padding:12px;
margin-top:15px;
border-radius:8px;
border:none;
background:#00ff00;
font-size:16px;
cursor:pointer;

}


button:hover{

background:white;

}


.message{

color:red;

}


</style>

</head>


<body>


<div class="code">

010101010101<br>
ACCESS SYSTEM<br>
root@anonymous:~$ login<br>
decrypting files...<br>
loading security modules...<br>
SYSTEM ONLINE<br>
010101010101<br>
WE ARE ANONYMOUS<br>
KERNEL ACCESS READY<br>

</div>



<div class="box">


<h1>Create Account</h1>


<h3>Kehadiran mu tidak diundang</h3>

<p>We Are Anonymous</p>



<input id="username" placeholder="Username">


<br>


<input id="password" type="password" placeholder="Password">


<br>


<button onclick="register()">
REGISTER
</button>


<p id="message"></p>


</div>




<script>


function register(){


let user=document.getElementById("username").value;

let pass=document.getElementById("password").value;



localStorage.setItem("username",user);

localStorage.setItem("password",pass);



alert("Account created successfully");



window.location="index.html";



}



</script>


</body>

</html>
