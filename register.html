<!DOCTYPE html>
<html>
<head>

<style>

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
}

.box{
    width:350px;
    padding:30px;
    text-align:center;
    border-radius:15px;
    border:1px solid #ccc;
}

input{
    width:90%;
    padding:12px;
    margin:10px;
    font-size:16px;
}

button{
    width:90%;
    padding:12px;
    margin-top:15px;
    font-size:16px;
}

</style>


<title>Military Hacker 69 Register</title>

</head>

<body>

<h1>Create Account</h1>

<input id="username" placeholder="Username">

<br><br>

<input id="password" type="password" placeholder="Password">

<br><br>

<button onclick="register()">
REGISTER
</button>

<p id="message"></p>


<script>

function register(){

let user = document.getElementById("username").value;
let pass = document.getElementById("password").value;


localStorage.setItem("username", user);
localStorage.setItem("password", pass);


document.getElementById("message").innerHTML =
"Account created";

}

</script>

</body>
</html>
