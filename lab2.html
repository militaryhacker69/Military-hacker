<!DOCTYPE html>
<html>

<head>

<title>LAB 2 Network Operations Simulator</title>

<style>

body{
background:#050505;
color:#00ff99;
font-family:monospace;
margin:0;
}

.header{
text-align:center;
padding:20px;
font-size:25px;
}

.panel{
margin:20px;
padding:20px;
border:1px solid #00ff99;
border-radius:15px;
background:#111;
}

.network{
text-align:center;
font-size:35px;
}

.device{

display:inline-block;
padding:20px;
margin:10px;
border:2px solid #00ff99;
border-radius:15px;
cursor:pointer;
transition:.3s;

}

.device:hover{

background:#00ff99;
color:black;

}


.line{

font-size:30px;

}


#info{

min-height:120px;

}


.status{

color:#00ff00;

}


</style>


</head>


<body>


<div class="header">

🌐 NETWORK OPERATIONS CENTER

</div>



<div class="panel">


<h2>LIVE NETWORK MAP</h2>


<div class="network">


<div class="device" onclick="showInfo('pc')">
💻<br>
USER PC
</div>


<div class="line">
⬇️
</div>


<div class="device" onclick="showInfo('router')">
📡<br>
ROUTER
</div>


<div class="line">
⬇️
</div>


<div class="device" onclick="showInfo('firewall')">
🔥<br>
FIREWALL
</div>


<div class="line">
⬇️
</div>


<div class="device" onclick="showInfo('server')">
🖥️<br>
SERVER
</div>



</div>


</div>





<div class="panel">


<h2>DEVICE INFORMATION</h2>


<div id="info">

Klik device untuk lihat maklumat.

</div>


</div>





<script>


function showInfo(device){


let info=document.getElementById("info");



if(device=="pc"){


info.innerHTML=
`
<b>💻 USER PC</b><br><br>

IP Address:
192.168.1.25<br>

Status:
<span class="status">
ONLINE
</span>
`;

}




if(device=="router"){


info.innerHTML=
`
<b>📡 ROUTER</b><br><br>

Gateway:
192.168.1.1<br>

Traffic:
Normal<br>

Status:
ONLINE
`;

}




if(device=="firewall"){


info.innerHTML=
`
<b>🔥 FIREWALL</b><br><br>

Rules:
15 Active<br>

Protection:
Enabled<br>

Status:
ACTIVE
`;

}




if(device=="server"){


info.innerHTML=
`
<b>🖥️ SERVER</b><br><br>

Service:
Web Server<br>

Port:
443 HTTPS<br>

Status:
ONLINE
`;

}



}

</div>   <!-- tutup panel network -->

<div class="panel">

<h2>📦 PACKET TRANSMISSION TEST</h2>

<button onclick="startPacket()">
START PACKET TEST
</button>

<p id="packet"></p>

</div>


<script>


function startPacket(){

let packet=document.getElementById("packet");

packet.innerHTML="💻 PC sending packet...";

setTimeout(function(){
packet.innerHTML="💻 PC ➡️ 📡 Router";
},1000);

setTimeout(function(){
packet.innerHTML="💻 PC ➡️ 📡 Router ➡️ 🔥 Firewall";
},2000);

setTimeout(function(){
packet.innerHTML="💻 PC ➡️ 📡 Router ➡️ 🔥 Firewall ➡️ 🖥️ Server";
},3000);

setTimeout(function(){
packet.innerHTML="✅ Packet delivered successfully";
},4000);

}
</script>



</body>

</html>
